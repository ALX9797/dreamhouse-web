<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shows // Dreamhouse</title>
<meta name="description" content="Dreamhouse — upcoming shows and tour dates.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #fafaf8;
    --ink: #111111;
    --accent: #7AD5FF;
    --accent-2: #47CAFF;
    --line: #111111;
    --muted: #6a6a66;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Space Grotesk', Arial, sans-serif;
    line-height:1.4;
    opacity:0;
    transition: opacity 0.5s ease;
  }
  a{color:inherit; text-decoration:none;}
  .mono{font-family:'JetBrains Mono', monospace;}
  .wrap{max-width:1100px; margin:0 auto; padding:0 24px;}

  /* AMBIENT COLOR (same as site.html) */
  .blob{
    position:fixed;
    width:340px; height:340px;
    border-radius:50%;
    background:var(--accent);
    filter:blur(90px);
    opacity:0.5;
    z-index:-1;
    top:-80px; left:-80px;
  }
  .blob2{
    position:fixed;
    width:300px; height:300px;
    border-radius:50%;
    background:var(--accent-2);
    filter:blur(100px);
    opacity:0.4;
    z-index:-1;
    bottom:-100px; right:-100px;
  }

  /* NAV */
  header{
    position:sticky; top:0; z-index:50;
    background:var(--bg);
    border-bottom:2px solid var(--line);
  }
  .navbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 24px;
  }
  .logo{
    font-weight:700; font-size:1.3rem; letter-spacing:-0.02em;
    text-transform:uppercase;
  }
  nav ul{
    display:flex; gap:28px; list-style:none;
  }
  nav a{
    font-family:'JetBrains Mono', monospace;
    font-size:0.8rem; text-transform:uppercase; letter-spacing:0.06em;
    border-bottom:2px solid transparent;
    padding-bottom:2px;
  }
  nav a:hover{border-bottom-color:var(--ink);}
  nav a.active{border-bottom-color:var(--ink);}
  .nav-toggle{display:none; background:none; border:2px solid var(--ink); padding:8px 10px; font-size:1rem; cursor:pointer;}

  /* PAGE HEAD */
  .page-head{
    border-bottom:2px solid var(--line);
    padding:80px 0 60px;
  }
  .page-tag{
    font-family:'JetBrains Mono', monospace;
    font-size:0.8rem; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--muted); margin-bottom:18px;
  }
  .page-head h1{
    font-size:clamp(2.6rem, 9vw, 5.5rem);
    line-height:0.95;
    font-weight:700;
    letter-spacing:-0.03em;
    text-transform:uppercase;
  }
  .page-sub{
    margin-top:18px;
    max-width:520px;
    font-size:1.05rem;
    color:var(--muted);
  }

  section{padding:70px 0;}

  /* TOUR (identical to site.html's Shows section) */
  .tour-list{list-style:none;}
  .tour-row{
    display:grid;
    grid-template-columns:120px 1fr 140px;
    gap:16px;
    align-items:center;
    padding:20px 0;
    border-bottom:1px solid var(--ink);
  }
  .tour-row:last-child{border-bottom:none;}
  .tour-date{
    font-family:'JetBrains Mono', monospace;
    font-size:0.85rem;
    color:var(--muted);
  }
  .tour-place{font-weight:700; text-transform:uppercase; font-size:1.05rem;}
  .tour-city{font-weight:400; color:var(--muted); font-size:0.9rem; text-transform:none;}
  .tour-link{
    justify-self:end;
    font-family:'JetBrains Mono', monospace;
    font-size:0.8rem;
    text-transform:uppercase;
    border:2px solid var(--ink);
    padding:8px 14px;
  }
  .tour-link:hover{background:var(--ink); color:var(--bg);}
  .tour-empty{
    font-family:'JetBrains Mono', monospace;
    font-size:0.85rem;
    color:var(--muted);
    padding:20px 0;
  }

  footer{
    padding:30px 24px;
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:10px;
    font-family:'JetBrains Mono', monospace;
    font-size:0.75rem;
    color:var(--muted);
    border-top:2px solid var(--line);
  }

  @media (max-width:720px){
    .page-head{
      padding-left: 16px;
    }
    .nav-toggle{
      margin-left: auto;
      display:block;
    }
    nav ul{
      position:fixed; top:63px; left:0; right:0; bottom:0;
      background:var(--bg);
      flex-direction:column;
      padding:30px 24px;
      gap:22px;
      transform:translateX(100%);
      transition:transform 0.2s ease;
    }
    nav ul.open{transform:translateX(0);}
    .tour-row{grid-template-columns:1fr; gap:6px;}
    .tour-link{justify-self:start;}
  }
</style>
</head>
<body>

<div class="blob"></div>
<div class="blob2"></div>

<header>
  <div class="navbar">
    <div class="logo">Dreamhouse</div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">☰</button>
    <nav>
      <ul id="navList">
        <li><a href="site.html#music">Music</a></li>
        <li><a href="site.html#about">About</a></li>
        <li><a href="shows.html" class="active">Shows</a></li>
        <li><a href="site.html#contact">Contact</a></li>
        <li><a href="house-secrets.html">House Secrets</a></li>
      </ul>
    </nav>
  </div>
</header>

<section class="page-head wrap">
  <div class="page-tag mono">Live // Dates</div>
  <h1>Shows</h1>
  <p class="page-sub">Where to catch Dreamhouse next.</p>
</section>

<section class="wrap">
  <ul class="tour-list">
    <li class="tour-row">
      <div class="tour-date mono">OCT 17</div>
      <div>
        <div class="tour-place">Neighbourhood Festival</div>
        <div class="tour-city">Various Venues, Manchester</div>
      </div>
      <a class="tour-link" href="https://dice.fm/event/g5mvl2-neighbourhood-festival-2026-17th-oct-various-venues-manchester-manchester-tickets?lng=en" target="_blank" rel="noopener">Tickets</a>
    </li>
    <!--
      Example row format once you have more dates — paste this right above
      the closing </ul> to add another:
      <li class="tour-row">
        <div class="tour-date mono">SEP 12</div>
        <div>
          <div class="tour-place">Venue Name</div>
          <div class="tour-city">City, State</div>
        </div>
        <a class="tour-link" href="#" target="_blank" rel="noopener">Tickets</a>
      </li>
    -->
  </ul>
</section>

<footer>
  <div>© <span id="year"></span> Dreamhouse</div>
  <div>Site built on alxsongs.com</div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
  const toggle = document.getElementById('navToggle');
  const navList = document.getElementById('navList');
  toggle.addEventListener('click', () => navList.classList.toggle('open'));
  navList.querySelectorAll('a').forEach(a => a.addEventListener('click', () => navList.classList.remove('open')));

  window.addEventListener('DOMContentLoaded', () => {
    requestAnimationFrame(() => {
      document.body.style.opacity = '1';
    });
  });
</script>

</body>
</html>
