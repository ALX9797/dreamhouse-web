<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dreamhouse</title>
<meta name="description" content="Dreamhouse — Band.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #fafaf8;
    --ink: #111111;
    --accent: #3fa9ff;
    --accent-2: #2b4fff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Space Grotesk', Arial, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    overflow:hidden;
    transition: opacity 0.45s ease;
  }
  body.fade-out{
    opacity:0;
  }
  .mono{font-family:'JetBrains Mono', monospace;}
  .splash{
    max-width:600px;
  }
  .tag{
    font-family:'JetBrains Mono', monospace;
    font-size:0.8rem;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:#6a6a66;
    margin-bottom:22px;
  }
  h1{
    font-size:clamp(2.4rem, 9vw, 5rem);
    line-height:0.95;
    font-weight:700;
    letter-spacing:-0.03em;
    text-transform:uppercase;
  }
  h1 .accent-word{
    color:var(--bg);
    -webkit-text-stroke: 2px var(--ink);
  }
  .come-inside{
    margin-top:18px;
    font-size:clamp(1.1rem, 3vw, 1.5rem);
    color:#444;
  }
  .enter-btn{
    display:inline-block;
    margin-top:42px;
    font-family:'JetBrains Mono', monospace;
    font-size:0.9rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    padding:16px 38px;
    border:2px solid var(--ink);
    background:var(--ink);
    color:var(--bg);
    transition:transform 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  .enter-btn:hover{
    transform:translate(-2px,-2px);
    box-shadow:4px 4px 0 var(--ink);
    background:var(--accent);
    color:var(--ink);
  }
  .blob{
    position:fixed;
    width:340px; height:340px;
    border-radius:50%;
    background:var(--accent);
    filter:blur(90px);
    opacity:0.5;
    z-index:-1;
    top:-80px; left:-80px;
  }
  .blob2{
    position:fixed;
    width:300px; height:300px;
    border-radius:50%;
    background:var(--accent-2);
    filter:blur(100px);
    opacity:0.4;
    z-index:-1;
    bottom:-100px; right:-100px;
  }
</style>
</head>
<body>

<div class="blob"></div>
<div class="blob2"></div>

<div class="splash">
  <div class="tag mono">Hello//World</div>
  <h1>This is <span class="accent-word">Dreamhouse</span></h1>
  <p class="come-inside">Come inside.</p>
  <a class="enter-btn" href="site.html">Enter →</a>
</div>

<script>
  document.querySelector('.enter-btn').addEventListener('click', function(e){
    e.preventDefault();
    const dest = this.getAttribute('href');
    document.body.classList.add('fade-out');
    setTimeout(function(){
      window.location.href = dest;
    }, 450);
  });
</script>

</body>
</html>
