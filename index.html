<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dreamhouse</title>
<meta name="description" content="Dreamhouse — Band.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Familjen+Grotesk:wght@700&display=swap" rel="stylesheet">
<link rel="prefetch" href="site.html">
<style>
  :root{
    --ink: #f5f6fa;
    --muted: #c3cbe6;
    --accent: #7AD5FF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{height:100%;}
  body{
    background: linear-gradient(rgba(5,10,25,0.45), rgba(5,10,25,0.45)), url('Dreaming Alone.jpg') center center / cover no-repeat;
    color: var(--ink);
    font-family:'Space Grotesk', Arial, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    overflow:hidden;
    transition: opacity 0.45s ease;
  }
  body.fade-out{
    opacity:0;
  }
  .mono{font-family:'JetBrains Mono', monospace;}
  .splash{
    max-width:600px;
  }
  .tag{
    font-family:'JetBrains Mono', monospace;
    font-size:0.8rem;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--muted);
    margin-bottom:22px;
  }
  h1{
    font-family:'Familjen Grotesk', sans-serif;
    font-size:clamp(2.4rem, 9vw, 5rem);
    line-height:0.95;
    font-weight:700;
    letter-spacing:-0.03em;
    text-transform:uppercase;
  }
  h1 .accent-word{
    color:#000000;
  }
  .come-inside{
    margin-top:18px;
    font-size:clamp(1.1rem, 3vw, 1.5rem);
    color:var(--muted);
  }
  .enter-btn{
    display:inline-block;
    margin-top:42px;
    font-family:'JetBrains Mono', monospace;
    font-size:0.9rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    padding:16px 38px;
    border:2px solid var(--ink);
    background:rgba(255,255,255,0.08);
    color:var(--ink);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition:transform 0.15s ease, background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .enter-btn:hover{
    transform:translate(-2px,-2px);
    box-shadow:4px 4px 0 var(--ink);
    background:var(--accent);
    color:#08131f;
    border-color:var(--accent);
  }
  .key-hint{
    display:block;
    margin-top:14px;
    font-family:'JetBrains Mono', monospace;
    font-size:0.7rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
    opacity:0.75;
  }
</style>
</head>
<body>

<div class="splash">
  <div class="tag mono">Hello//World</div>
  <h1>This is <span class="accent-word">Dreamhouse</span></h1>
  <p class="come-inside">Come inside.</p>
  <a class="enter-btn" href="site.html">Enter →</a>
  <span class="key-hint mono"></span>
</div>

<script>
  const enterBtn = document.querySelector('.enter-btn');
  let navigating = false;

  function goToSite(){
    if (navigating) return;
    navigating = true;
    const dest = enterBtn.getAttribute('href');
    document.body.classList.add('fade-out');
    setTimeout(function(){
      window.location.href = dest;
    }, 450);
  }

  enterBtn.addEventListener('click', function(e){
    e.preventDefault();
    goToSite();
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' ' || e.code === 'Space'){
      e.preventDefault();
      goToSite();
    }
  });
</script>

</body>
</html>
